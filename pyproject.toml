authors = [
    { name = "Rodrigo Arbones V", email = "120335790+arboness@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ipykernel>=7.3.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
